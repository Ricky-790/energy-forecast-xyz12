[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the wind forecast decision support app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.161.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.1.1",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "backend"

